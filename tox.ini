[tox]
requires =
    tox>=4
envlist =
    py3, docs-{linux, win32, macos}, formatting, typing, tests
skipsdist = true

[testenv]
runner = uv-venv-lock-runner
passenv = *
allowlist_externals = *
isolated_build = true
platform =
    linux: linux
    win32: win32
    macos: darwin

basepython = python3
recreate = false

[testenv:tests]
commands =
    uv sync --dev
    uv run coverage run --source=. -m pytest tests
    uv run coverage report -m

[testenv:coverage]
commands =
    .tox/tests/bin/coverage xml -o coverage.xml


[testenv:formatting]
commands =
    uv tool run pre-commit run --all-files

[testenv:typing]
commands =
    uv sync --group typing
    uv run mypy --strict .

[testenv:docs-win32]
changedir = docs
commands =
    uv sync --group docs
    uv run sphinx-apidoc -f -o source/ ../ ../tests/
    ./make.bat clean
    ./make.bat html

[testenv:docs-linux]
changedir = docs
commands =
    uv sync --group docs
    uv run sphinx-apidoc -f -o source/ ../ ../tests/
    make clean
    make html

[testenv:docs-macos]
changedir = docs
commands =
    uv sync --group docs
    uv run sphinx-apidoc -f -o source/ ../ ../tests/
    make clean
    make html
