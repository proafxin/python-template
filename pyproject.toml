[project]
name = "pytemplates"
version = "0.1.0"
description = "Templates for python applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
docs = [
    "furo>=2024.8.6",
    "sphinx>=8.2.3",
]
typing = [
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 100
